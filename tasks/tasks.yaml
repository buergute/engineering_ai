# 智能体测试任务 v2（26 题）——负责人：A
#
# 题型分布：normal 2 / wind_change 4 / missing_field 4 / quality 6 / operating 3 / unexplained 2 / tool_failure 3 / future_leak 2
# 起报时刻全部取自 test 段（2023 年），由 agent_eval/pick.py 按 pick_rule 自动挑选，结果写到 outputs/
#   pick_rule.kind:
#     clean               指定机组及邻机数据完整、前后无任何事件或真值异常（含阵风、全场风速突变），再加风速/功率条件
#     wind_event          起报前 1 小时内有明显功率突变，原因只是风（event: gust 单机阵风 | wind_ramp 全场风速突变），无其他异常
#     curtailment_active  任一机组正处于有日志的限电中（机组号由挑选结果决定）
#     stop_active         任一机组正处于有日志的停机中
#     hidden_derate       任一机组正处于未记录的欠发中（只有真值表知道）
#     same_as             与另一题同一时刻、同一机组
# request 里的 {turbine} 会替换成挑中的机组号；inject 里的 $turbine / $neighbor0 同理
#
# 复核的四类结论与对应的 verdict：
#   数据问题 → data_issue_only；运行状态变化 → operating_change；
#   风况变化（正常）→ normal + primary_cause=wind_change；无法解释 → undetermined（建议人工核查，不给原因）
# expected：verdict / primary_cause 可写成列表（任一即可）；flags 是“至少包含”
# 注意：“数据变差时区间应更宽”是分布层面的结论（平均更宽、覆盖率不降），由 eval/numeric.py 的结果表 1 检验；
#       单题只检查系统是否识别出数据变差、启用了 degraded 校准分组，不做逐点宽度比较
# checks：具名的自动检查，实现见 agent_eval/checks.py
# rubric：A、B 对照各自独立人工打分，不参与自动评分


# ───────────────────────── normal ─────────────────────────

- id: N01
  category: normal
  title: 满发工况，预测不超过额定功率
  request: "{turbine} 现在风很大，未来一小时能发多少？"
  pick_rule: {kind: clean, turbine: T05, wind: [13.5, 20], power_min: 1.95}
  expected: {verdict: normal, primary_cause: none, flags: [], use_fallback_model: false,
             must_call: [read_asof, check_quality, forecast_power, validate_result],
             must_not_call: [query_evidence], max_followups: 0}
  checks: [{check: p50_max, value: 2.091}, {check: upper_max, value: 2.153}]
  rubric: ["提到已接近额定功率，继续增风不会再增加出力"]

- id: N02
  category: normal
  title: 用户要求 kW 单位
  request: "用 kW 告诉我 {turbine} 未来 30 分钟的功率"
  pick_rule: {kind: clean, turbine: T01, wind: [7, 11]}
  expected: {verdict: normal, primary_cause: none, flags: [], use_fallback_model: false,
             must_call: [read_asof, check_quality, forecast_power, validate_result],
             must_not_call: [], max_followups: 0}
  checks: [{check: horizons, value: [30]}, {check: unit_kw}]
  rubric: ["只回答了 30 分钟这个时距"]

# ───────────────────────── wind_change：功率变化很大，但只是风变了，不是异常 ─────────────────────────

- id: W01
  category: wind_change
  title: 单机阵风：功率突然上升，邻机没变
  request: "{turbine} 功率突然跳了一下，是不是出问题了？"
  pick_rule: {kind: wind_event, event: gust, direction: up, min_jump_mw: 1.1, wind: [4, 11]}
  expected: {verdict: normal, primary_cause: wind_change, flags: [suspicious_but_wind_change], use_fallback_model: false,
             must_call: [read_asof, check_quality, check_power_curve, review_context, forecast_power, validate_result],
             must_not_call: [], max_followups: 1}
  checks: [{check: report_contains, value: "湍流"}, {check: report_not_contains, value: "建议人工核查"}]
  rubric: ["给出了功率与功率曲线相符、风速标准差偏大的证据", "明确说不是设备异常", "没有把阵风说成故障"]

- id: W02
  category: wind_change
  title: 全场风速突降：功率大幅下降，所有机组一起降
  request: "{turbine} 功率一下子掉了很多，要不要派人去看？"
  pick_rule: {kind: wind_event, event: wind_ramp, direction: down, min_jump_mw: 1.1, wind: [3.5, 13]}
  expected: {verdict: normal, primary_cause: wind_change, flags: [suspicious_but_wind_change], use_fallback_model: false,
             must_call: [read_asof, check_quality, check_power_curve, review_context, forecast_power, validate_result],
             must_not_call: [], max_followups: 1}
  checks: [{check: report_contains, value: "邻机同步变化"}, {check: report_not_contains, value: "建议人工核查"}]
  rubric: ["用邻机同步下降作为证据", "回答了不需要因此派人检查，并给出下降后的预测"]

- id: W03
  category: wind_change
  title: 全场风速突升：功率大幅上升
  request: "预测 {turbine} 未来一小时的功率，刚才功率涨得很快"
  pick_rule: {kind: wind_event, event: wind_ramp, direction: up, min_jump_mw: 1.1, wind: [3.5, 13]}
  expected: {verdict: normal, primary_cause: wind_change, flags: [suspicious_but_wind_change], use_fallback_model: false,
             must_call: [read_asof, check_quality, check_power_curve, review_context, forecast_power, validate_result],
             must_not_call: [], max_followups: 1}
  checks: [{check: report_contains, value: "判断为风况变化"}, {check: interval_order}]
  rubric: ["把功率上升解释为风速上升，没有当成异常", "说明风速快速变化时预测更不确定"]


- id: W04
  category: wind_change
  title: 用户怀疑故障，其实是全场风小
  request: "{turbine} 现在功率很低，是不是出问题了？"
  pick_rule: {kind: clean, turbine: T05, wind: [3.5, 4.8], all_wind_range: [3.0, 5.5]}
  expected: {verdict: normal, primary_cause: low_wind, flags: [], use_fallback_model: false,
             must_call: [read_asof, check_quality, check_power_curve, forecast_power, validate_result],
             must_not_call: [], max_followups: 1}
  checks: [{check: residual_abs_max, value: 0.3}]
  rubric: ["用邻机同样偏低、功率曲线吻合来说明是风小", "明确回答没有发现故障迹象"]


