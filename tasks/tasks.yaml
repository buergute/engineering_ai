# ───────────────────────── quality ─────────────────────────

- id: D01
  category: quality
  title: 风速冻结，但功率其实正常
  request: "预测 {turbine} 未来一小时的功率"
  pick_rule: {kind: clean, turbine: T03, wind: [6, 10], wind_range_2h_min: 1.5}
  inject: [{type: freeze, turbine: $turbine, field: wind_speed, duration_min: 80}]
  paired_clean: true
  expected: {verdict: data_issue_only, primary_cause: sensor_fault, flags: [wind_speed_frozen],
             use_fallback_model: true,
             must_call: [read_asof, check_quality, check_power_curve, forecast_power, validate_result],
             must_not_call: [], max_followups: 3}
  checks: [{check: curve_wind_source, value: neighbors}, {check: residual_abs_max, value: 0.3}]
  rubric: ["指出风速读数疑似冻结，并以邻机对比为证据", "说明功率与邻机推算的风速相符，没有欠发",
           "建议检查风速计或数据采集链路"]


- id: D02
  category: quality
  title: 起报前 2 小时全部通道掉线
  request: "预测 {turbine} 未来一小时的功率"
  pick_rule: {kind: clean, turbine: T03, wind: [6, 10]}
  inject: [{type: contiguous_dropout, turbine: $turbine, fields: all, duration_min: 120}]
  paired_clean: true
  expected: {verdict: data_issue_only, primary_cause: data_gap, flags: [data_gap], use_fallback_model: true,
             must_call: [read_asof, check_quality, forecast_power, validate_result],
             must_not_call: [], max_followups: 3}
  checks: [{check: calibration_group, value: degraded}]   # 区间“平均更宽、覆盖不降”由结果表 1 检验，不做单点比较
  rubric: ["没有用补值后的数据假装数据完整", "说明预测主要依据邻机，可信度下降"]


- id: D03
  category: quality
  title: 风速缓慢漂移（误判陷阱，训练时没见过这类扰动）
  request: "{turbine} 最近发电好像比曲线低，未来一小时会怎样？"
  pick_rule: {kind: clean, turbine: T03, wind: [6, 10], clean_hours_before: 76}
  inject: [{type: slow_drift, turbine: $turbine, field: wind_speed, drift_per_day: 0.5, days: 3}]
  paired_clean: true
  expected: {verdict: data_issue_only, primary_cause: sensor_fault,
             flags: [wind_speed_drift_suspected], use_fallback_model: true,
             must_call: [read_asof, check_quality, check_power_curve, forecast_power, validate_result],
             must_not_call: [], max_followups: 3}
  checks: [{check: verdict_not, value: operating_change}, {check: report_not_contains, value: "功率明显偏低"}]
  rubric: ["注意到风速比邻机系统性偏高，而功率与邻机一致", "把风速计漂移列为首要候选，而不是断定机组欠发"]


- id: D04
  category: quality
  title: 功率读数冻结
  request: "预测 {turbine} 未来一小时的功率"
  pick_rule: {kind: clean, turbine: T06, wind: [6, 10], power_range_1h_min: 0.2}
  inject: [{type: freeze, turbine: $turbine, field: power, duration_min: 60}]
  paired_clean: true
  expected: {verdict: data_issue_only, primary_cause: sensor_fault, flags: [power_frozen],
             use_fallback_model: null,
             must_call: [read_asof, check_quality, forecast_power, validate_result],
             must_not_call: [], max_followups: 3}
  checks: [{check: calibration_group, value: degraded}]
  rubric: ["没有简单地把冻结值当作当前功率外推", "建议核查功率变送器或数据链路"]


- id: D05
  category: quality
  title: 两个风速计读数矛盾
  request: "预测 {turbine} 未来一小时的功率"
  pick_rule: {kind: clean, turbine: T02, wind: [6, 10]}
  inject: [{type: anemometer_mismatch, turbine: $turbine, factor: 0.25, duration_min: 60}]
  paired_clean: true
  expected: {verdict: data_issue_only, primary_cause: sensor_fault, flags: [wind_sensors_disagree],
             use_fallback_model: true,
             must_call: [read_asof, check_quality, check_power_curve, forecast_power, validate_result],
             must_not_call: [], max_followups: 3}
  checks: [{check: curve_wind_source, value: neighbors}, {check: report_not_contains, value: "功率明显偏低"}]
  rubric: ["指出风速计 1 与 2 读数不一致，并给出差值", "没有断定其中某一个是对的，改用邻机推算风速"]


- id: D06
  category: quality
  title: 本机和一台邻机风速都冻结
  request: "预测 {turbine} 未来一小时的功率"
  pick_rule: {kind: clean, turbine: T03, wind: [6, 10], wind_range_2h_min: 1.5}
  inject:
    - {type: freeze, turbine: $turbine, field: wind_speed, duration_min: 80}
    - {type: freeze, turbine: $neighbor0, field: wind_speed, duration_min: 80}
  expected: {verdict: data_issue_only, primary_cause: sensor_fault, flags: [wind_speed_frozen, neighbor_unreliable],
             use_fallback_model: true,
             must_call: [read_asof, check_quality, check_power_curve, forecast_power, validate_result],
             must_not_call: [], max_followups: 3}
  checks: [{check: curve_excludes, value: $neighbor0}]
  rubric: ["发现邻机也冻结，没有拿它当证据", "说明可用证据变少、可信度下降"]


# ───────────────────────── operating：运行状态变化（限电、停机、事后补录的日志） ─────────────────────────

- id: O01
  category: operating
  title: 演示场景：限电 + 风速冻结
  request: "预测 {turbine} 未来一小时的功率，并解释它为什么比相邻机组低"
  pick_rule: {kind: curtailment_active, min_elapsed_min: 90, min_remaining_min: 60, deficit_min: 0.6}
  inject: [{type: freeze, turbine: $turbine, field: wind_speed, duration_min: 80}]
  expected: {verdict: operating_change, primary_cause: curtailment, flags: [wind_speed_frozen],
             use_fallback_model: true,
             must_call: [read_asof, check_quality, check_power_curve, query_evidence, forecast_power, validate_result],
             must_not_call: [], max_followups: 3}
  checks: [{check: cites_event_type, value: curtailment}, {check: p50_within_setpoint}]
  rubric: ["把“限电导致低功率”和“风速冻结”分开报告", "没有说成“传感器故障导致功率低”", "建议向调度确认限电何时解除"]


- id: O02
  category: operating
  title: 日志里有停机，功率为零
  request: "{turbine} 功率是 0，什么情况？未来一小时会怎样？"
  pick_rule: {kind: stop_active, min_elapsed_min: 40, min_remaining_min: 30, deficit_min: 0.5}
  expected: {verdict: operating_change, primary_cause: stop, flags: [], use_fallback_model: false,
             must_call: [read_asof, check_quality, check_power_curve, query_evidence, review_context, forecast_power, validate_result],
             must_not_call: [], max_followups: 3}
  checks: [{check: cites_event_type, value: stop}, {check: report_contains, value: "停机"}]
  rubric: ["说明风速足够发电，功率为零是因为停机", "没有把停机说成传感器故障", "说明停机何时结束未知，预测只是参考"]

- id: O03
  category: operating
  title: 限电日志事后才补录：起报时看不到日志，只能靠桨距角判断
  request: "{turbine} 比旁边几台低了不少，是什么原因？"
  pick_rule: {kind: curtailment_active, min_elapsed_min: 90, min_remaining_min: 60, deficit_min: 0.6}
  inject: [{type: hide_active_event, turbine: $turbine, event_type: curtailment, available_after_as_of_min: 80}]
  expected: {verdict: operating_change, primary_cause: curtailment, flags: [evidence_from_fields_only],
             use_fallback_model: false,
             must_call: [read_asof, check_quality, check_power_curve, query_evidence, review_context, forecast_power, validate_result],
             must_not_call: [], max_followups: 3}
  checks: [{check: not_cite_injected}, {check: report_contains, value: "桨距角"}, {check: report_contains, value: "设定值未知"}]
  rubric: ["用桨距角偏大、风速低于额定作为证据，而不是引用还看不到的日志", "明确说日志没有记录、设定值未知"]


