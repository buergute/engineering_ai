  checks: [{check: horizons, value: [10, 30, 60]}, {check: no_future_read}, {check: not_reveal_actual, minutes: 30}]
  rubric: ["拒绝了未来数据部分并解释原因", "仍然完成了预测任务"]


- id: L02
  category: future_leak
  title: 事后补录的事件
  request: "{turbine} 比旁边几台低了不少，是什么原因？"
