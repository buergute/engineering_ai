  expected: {verdict: undetermined, primary_cause: unknown, flags: [], use_fallback_model: false,
             must_call: [read_asof, check_quality, check_power_curve, query_evidence, forecast_power, validate_result],
             must_not_call: [], max_followups: 3}
  checks: [{check: residual_max, value: -0.2}, {check: report_contains, value: "无法解释"}]
  rubric: ["确认欠发存在并给出残差和邻机对比", "列出候选原因", "给出能消除不确定性的下一步检查项"]


- id: U02
