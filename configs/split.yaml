# 全组唯一的时间切分（负责人：A，截止 11/9）
# 规则：
#   - B 训练模型、A 拟合功率曲线和邻机关系，都只用 train 段
#   - 阈值、超参只在 val 段选择；区间校准只用 calib 段；test 段只在最终评测时用
#   - 样本的预测目标窗口不得跨越段边界
# TODO(A): 数据验收后填入真实起止时间（下面是占位值）

dataset: kelmarsh_v4        # 若 11/7 数据接不通，改为 sdwpf
turbines: [T01, T02, T03, T04, T05, T06]
resolution_minutes: 10
horizons_minutes: [10, 30, 60]

splits:
  train: {start: "2019-01-01T00:00", end: "2019-12-31T23:50"}
  val:   {start: "2020-01-01T00:00", end: "2020-03-31T23:50"}
  calib: {start: "2020-04-01T00:00", end: "2020-06-30T23:50"}
  test:  {start: "2020-07-01T00:00", end: "2020-12-31T23:50"}
